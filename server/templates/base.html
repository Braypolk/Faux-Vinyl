<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f0e7"><title>{% block title %}FauxVinyl{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script defer src="{{ url_for('static', filename='app.js') }}"></script>{% block head %}{% endblock %}</head>
<body><div class="shell"><header><a class="brand" href="/" aria-label="FauxVinyl home"><span class="record-mark" aria-hidden="true"></span>fauxvinyl<span class="brand-dot">.</span></a>{% if authenticated %}<nav>{% if request.endpoint != 'index' %}<a href="/">Shelf</a>{% endif %}<a href="/settings">Settings</a><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf() }}"><button class="quiet" type="submit">Sign out</button></form></nav>{% endif %}</header><main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></div></body></html>
