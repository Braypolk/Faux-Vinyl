{{define "base"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f0e7"><title>{{.Title}}{{if .Dev}} · Local{{end}}</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script>{{template "head" .}}{{if .Dev}}<link rel="stylesheet" href="/__dev__/dev.css"><script defer src="/__dev__/live.js"></script>{{end}}</head>
<body><div class="shell"><header><a class="brand" href="/" aria-label="FauxVinyl home"><span class="record-mark" aria-hidden="true"></span>fauxvinyl<span class="brand-dot">.</span></a>{{if .Authenticated}}<nav>{{if ne .Page "index"}}<a href="/">Shelf</a>{{end}}<a href="/settings">Settings</a><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="quiet" type="submit">Sign out</button></form></nav>{{end}}</header><main>{{if .Notice}}<div class="notice success" role="status">{{.Notice}}</div>{{end}}{{template "content" .}}</main></div></body></html>{{end}}
