services:
  fauxvinyl:
    build:
      context: .
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      GOMEMLIMIT: 96MiB
      GOGC: "50"
    volumes:
      - ./data:/data
      - ./collection:/app/collection:ro
    ports:
      - 127.0.0.1:8787:8787
    mem_limit: 256m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
